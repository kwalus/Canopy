  <g>
    <rect x="1014" y="394" width="272" height="130" rx="24" fill="#101B2A" stroke="#25384D"/>
    <text x="1042" y="430" fill="#93A7BD" font-size="16" font-family="Avenir Next, Segoe UI, sans-serif" font-weight="700">Human altitude</text>
    <text x="1042" y="470" fill="#F8FAFC" font-size="28" font-family="Avenir Next, Segoe UI, sans-serif" font-weight="800">Supervisory</text>
    <text x="1042" y="503" fill="#A78BFA" font-size="18" font-family="Avenir Next, Segoe UI, sans-serif">Intervene on uncertainty, handoff, or path anomalies</text>
  </g>
  <g>
