    <text x="1170" y="636" fill="#F8FAFC" font-size="17" font-family="Avenir Next, Segoe UI, sans-serif" font-weight="800" text-anchor="middle">bounded execute</text>
    <text x="742" y="682" fill="#8EA4BA" font-size="20" font-family="Avenir Next, Segoe UI, sans-serif">Canopy does not dump raw control. It gives operators a clear supervisory surface with bounded actions and explicit human gates.</text>
