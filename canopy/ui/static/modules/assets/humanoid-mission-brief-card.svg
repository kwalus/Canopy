    <text x="742" y="470" fill="#F8FAFC" font-size="28" font-family="Avenir Next, Segoe UI, sans-serif" font-weight="800">Approach pallet A</text>
    <text x="742" y="503" fill="#67E8F9" font-size="18" font-family="Avenir Next, Segoe UI, sans-serif">Visual corridor locked · grasp align pending</text>
