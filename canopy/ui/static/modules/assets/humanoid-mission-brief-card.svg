    <text x="742" y="586" fill="#93A7BD" font-size="16" font-family="Avenir Next, Segoe UI, sans-serif" font-weight="700">Bounded autonomy ladder</text>
    <rect x="742" y="612" width="160" height="36" rx="18" fill="#0B1724" stroke="#244157"/>
    <text x="822" y="636" fill="#F8FAFC" font-size="17" font-family="Avenir Next, Segoe UI, sans-serif" font-weight="800" text-anchor="middle">supervised</text>
    <rect x="916" y="612" width="160" height="36" rx="18" fill="url(#cyan)"/>
    <text x="996" y="636" fill="#082138" font-size="17" font-family="Avenir Next, Segoe UI, sans-serif" font-weight="800" text-anchor="middle">copilot</text>
