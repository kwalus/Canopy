  <text x="118" y="266" fill="#93A7BD" font-size="28" font-family="Avenir Next, Segoe UI, sans-serif">One source becomes a coordination world spanning robot eyes, task stack, and human intervention.</text>

  <rect x="118" y="316" width="520" height="434" rx="28" fill="#0A1421" stroke="#223346"/>
  <text x="156" y="362" fill="#9DB4C9" font-size="18" font-family="Avenir Next, Segoe UI, sans-serif" font-weight="700" letter-spacing="2">MISSION GEOMETRY</text>
  <rect x="156" y="390" width="440" height="300" rx="24" fill="#0D1A2A" stroke="#20364B"/>
  <rect x="204" y="442" width="312" height="158" rx="22" fill="#132437" stroke="#274156"/>
  <rect x="438" y="492" width="74" height="72" rx="12" fill="#22D3EE" opacity="0.86"/>
  <rect x="533" y="474" width="44" height="96" rx="10" fill="#A855F7" opacity="0.52"/>
  <path d="M296 650C314 560 342 510 394 470" stroke="#F8FAFC" stroke-width="18" stroke-linecap="round"/>
  <path d="M462 650C444 560 416 510 364 470" stroke="#F8FAFC" stroke-width="18" stroke-linecap="round"/>
  <circle cx="378" cy="430" r="16" fill="url(#cyan)"/>
  <rect x="184" y="410" width="176" height="34" rx="17" fill="#08111D" stroke="#234058"/>
  <text x="272" y="433" fill="#67E8F9" font-size="17" font-family="Avenir Next, Segoe UI, sans-serif" font-weight="800" text-anchor="middle">ego + assist corridor</text>
  <text x="156" y="722" fill="#8EA4BA" font-size="20" font-family="Avenir Next, Segoe UI, sans-serif">Camera layer, arm corridor, object confidence, and safe handoff posture all remain visible.</text>

  <rect x="676" y="316" width="648" height="434" rx="28" fill="#0A1421" stroke="#223346"/>
  <text x="714" y="362" fill="#9DB4C9" font-size="18" font-family="Avenir Next, Segoe UI, sans-serif" font-weight="700" letter-spacing="2">COORDINATION STACK</text>
  <g>
