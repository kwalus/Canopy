  <text x="466" y="301" fill="#F8FBFF" font-family="Avenir Next, Segoe UI, sans-serif" font-size="24" font-weight="700">Score route: 120 clean / 60 late / -25 off-grid</text>
  <text x="876" y="301" fill="#F8FBFF" font-family="Avenir Next, Segoe UI, sans-serif" font-size="24" font-weight="700">Best habit: hit through the line, not after it</text>

