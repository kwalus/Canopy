  <text x="74" y="106" fill="#67E8F9" font-family="Avenir Next, Segoe UI, sans-serif" font-size="26" font-weight="800" letter-spacing="4">KEYBOARD HERO // LANE MAP</text>
  <text x="74" y="152" fill="#EEF6FF" font-family="Avenir Next, Segoe UI, sans-serif" font-size="56" font-weight="800">Two-hand layout built for fast deck practice</text>
  <text x="74" y="202" fill="#9CB2CA" font-family="Avenir Next, Segoe UI, sans-serif" font-size="28">Left hand anchors the lower lanes. Right hand chases the upper lanes. Keep the elbows quiet and the hits clean.</text>

